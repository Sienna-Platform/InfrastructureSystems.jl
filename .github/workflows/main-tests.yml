name: Main - CI

on:
  push:
    branches:
      - main
    schedule:
      - cron: 0 * * * *
jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1', 'nightly']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/julia-buildpkg@latest
        env:
          PYTHON: ""
      # The outputs tests read the artifact with h5py and validate it with jsonschema.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install outputs test Python packages
        shell: bash
        run: |
          python -m pip install h5py jsonschema referencing
          echo "SIENNA_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-runtest@latest
        continue-on-error: ${{ matrix.julia-version == 'nightly' }}
        env:
          PYTHON: ""
      # Coverage is reported from a single job: the matrix would otherwise submit six
      # reports per commit, and the Windows ones carry backslash paths Codecov cannot
      # match against the repo tree.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          files: ./lcov.info
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          slug: ${{ github.repository }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
